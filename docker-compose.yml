# Full stack: agent + MCP server + OpenTelemetry Collector + Prometheus + Alertmanager
#             + Tempo (traces) + Loki (logs) + Grafana (dashboards).
#
#   cp .env.example .env   # set MCP_AUTH_TOKEN and GRAFANA_ADMIN_PASSWORD
#   docker compose up -d --build
#   # Ollama on the host is used by default; or: docker compose --profile ollama up -d
name: stock-agent

x-app-env: &app-env
  DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: json
  LOG_PAYLOADS: ${LOG_PAYLOADS:-true}
  MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}

x-hardening: &hardening
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  # ------------------------------------------------------------------ apps --
  mcp-server:
    <<: *hardening
    build: .
    pull_policy: build          # image is built locally, never pulled from a registry
    image: stock-agent:${IMAGE_TAG:-latest}
    command: ["stock-agent-mcp"]
    environment:
      <<: *app-env
      MCP_PORT: "8000"
      HEALTHCHECK_URL: http://127.0.0.1:8000/healthz
    volumes:
      - ./data:/app/data:ro
      - charts:/app/charts
    depends_on: [otel-collector]
    deploy:
      resources:
        limits: {cpus: "2", memory: 2g}

  agent:
    <<: *hardening
    build: .                    # same image as mcp-server (second build is a cache hit)
    pull_policy: build
    image: stock-agent:${IMAGE_TAG:-latest}
    command: ["stock-agent-api"]
    environment:
      <<: *app-env
      MCP_SERVER_URL: http://mcp-server:8000/mcp
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:latest}
      LLM_COST_PER_1K_INPUT_TOKENS: ${LLM_COST_PER_1K_INPUT_TOKENS:-0}
      LLM_COST_PER_1K_OUTPUT_TOKENS: ${LLM_COST_PER_1K_OUTPUT_TOKENS:-0}
      HEALTHCHECK_URL: http://127.0.0.1:8080/healthz
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8080:8080"]
    depends_on:
      mcp-server: {condition: service_healthy}
      otel-collector: {condition: service_started}
    deploy:
      resources:
        limits: {cpus: "1", memory: 1g}

  ui:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./deploy/ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - charts:/srv/charts:ro
    ports: ["8088:8080"]          # open http://localhost:8088
    depends_on: [agent, prometheus, tempo]
    restart: unless-stopped

  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.6.2
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]
    restart: unless-stopped

  # ---------------------------------------------------------- telemetry ----
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./deploy/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro"]
    environment:
      TEMPO_OTLP_ENDPOINT: tempo:4317
      LOKI_OTLP_ENDPOINT: http://loki:3100/otlp
    ports: ["4317:4317", "4318:4318"]   # expose OTLP for apps running outside compose
    depends_on: [tempo, loki]
    restart: unless-stopped
    deploy:
      resources:
        limits: {memory: 512m}

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver   # Tempo service-graph / span metrics
      - --enable-feature=exemplar-storage
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./deploy/alertmanager:/etc/alertmanager:ro
      - alertmanager:/alertmanager
    ports: ["9093:9093"]
    restart: unless-stopped

  tempo-init:   # Tempo runs as uid 10001; fix ownership of the fresh volume once.
    image: busybox:1.37
    command: ["chown", "-R", "10001:10001", "/var/tempo"]
    volumes: [tempo:/var/tempo]

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo:/var/tempo
    depends_on:
      tempo-init: {condition: service_completed_successfully}
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agent-mcp-overview.json
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo, loki]
    restart: unless-stopped

volumes:
  charts: {}
  ollama: {}
  prometheus: {}
  alertmanager: {}
  tempo: {}
  loki: {}
  grafana: {}
