[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stock-agent"
version = "1.0.0"
description = "LangGraph stock-research agent with MCP tools and OpenTelemetry observability"
requires-python = ">=3.11"
dependencies = [
    # Agent / LLM
    "langgraph>=1.2,<2",
    "langchain-core>=1.0,<2",
    "langchain-ollama>=1.0,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
    # MCP server + tools
    "mcp>=1.30,<2",
    "wikipedia>=1.4",
    "pandas>=2.2",
    "tabulate>=0.9",
    "matplotlib>=3.9",
    # Service
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    # Observability (OpenTelemetry, OTLP over HTTP/protobuf)
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-httpx>=0.66b0",
    "opentelemetry-instrumentation-asgi>=0.66b0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-semantic-conventions>=0.66b0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
stock-agent-api = "stock_agent.agent.api:main"
stock-agent-cli = "stock_agent.agent.cli:main"
stock-agent-mcp = "stock_agent.mcp_server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
