# Routing: critical -> pager channel, warning -> team channel.
# Out of the box both receivers are inert so the stack starts without secrets.
# To enable Slack: put the webhook URL in deploy/alertmanager/secrets/slack_webhook_url
# and uncomment the slack_configs blocks (see README "Alert delivery").
global:
  resolve_timeout: 5m

route:
  receiver: team-warnings
  group_by: [alertname, service_name, gen_ai_tool_name]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: oncall-critical
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  # If the MCP server is down, don't also page for every tool failing.
  - source_matchers: [alertname="McpServerDown"]
    target_matchers: [alertname=~"McpTool.*|McpClientTransportErrors"]
  - source_matchers: [alertname="OtelCollectorDown"]
    target_matchers: [alertname=~"McpServerDown|AgentDown"]
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, gen_ai_tool_name]

receivers:
