# Stock desk UI: static files + same-origin reverse proxy (no CORS needed).
# Only the read-only Prometheus/Tempo endpoints the UI uses are exposed.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /config.js {
        expires -1;
    }

    # Agent API (incl. Server-Sent Events streaming: no buffering, long reads)
    location /api/ {
        proxy_pass http://agent:8080/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 330s;
    }

    # Prometheus: read-only query endpoints used by the health rail
    location ~ ^/prom/api/v1/(query|query_range|alerts)$ {
        limit_except GET { deny all; }
        rewrite ^/prom/(.*)$ /$1 break;
        proxy_pass http://prometheus:9090;
    }

    # Tempo: fetch a single trace by id
    location ~ "^/tempo/api/traces/[0-9a-f]{32}$" {
        limit_except GET { deny all; }
        rewrite ^/tempo/(.*)$ /$1 break;
        proxy_pass http://tempo:3200;
    }

    # Anything else under these prefixes is not exposed.
    location /prom/   { return 404; }
    location /tempo/  { return 404; }
    location /charts/ { return 404; }

    # Charts written by the Python tool (shared volume, read-only)
    location ~ ^/charts/([A-Za-z0-9._-]+\.(png|jpg|jpeg|svg))$ {
        alias /srv/charts/$1;
        expires 1h;
    }
}
