groups:
  - name: mcp.recording
    interval: 30s
    rules:
      # ---- MCP tools: server-side view (authoritative failure classification) ----
      - record: mcp_tool:calls:rate5m
        expr: sum by (service_name, gen_ai_tool_name) (rate(mcp_server_operation_duration_seconds_count{mcp_method_name="tools/call"}[5m]))
      - record: mcp_tool:errors:rate5m
        expr: sum by (service_name, gen_ai_tool_name, error_type) (rate(mcp_server_operation_duration_seconds_count{mcp_method_name="tools/call", error_type!=""}[5m]))
      # System failures only (excludes bad input produced by the LLM).
      - record: mcp_tool:failure_ratio:rate5m
        expr: |
          (
            sum by (service_name, gen_ai_tool_name) (rate(mcp_server_operation_duration_seconds_count{mcp_method_name="tools/call", error_type!="", error_type!="tool_input_error"}[5m]))
            or
            mcp_tool:calls:rate5m * 0
          )
          / (mcp_tool:calls:rate5m > 0)
      - record: mcp_tool:input_error_ratio:rate5m
        expr: |
          (
            sum by (service_name, gen_ai_tool_name) (rate(mcp_server_operation_duration_seconds_count{mcp_method_name="tools/call", error_type="tool_input_error"}[5m]))
            or
            mcp_tool:calls:rate5m * 0
          )
          / (mcp_tool:calls:rate5m > 0)
      - record: mcp_tool:latency_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le, gen_ai_tool_name) (rate(mcp_server_operation_duration_seconds_bucket{mcp_method_name="tools/call"}[5m])))
      - record: mcp_tool:latency_seconds:p50_5m
        expr: histogram_quantile(0.50, sum by (le, gen_ai_tool_name) (rate(mcp_server_operation_duration_seconds_bucket{mcp_method_name="tools/call"}[5m])))

      # ---- MCP tools: client-side view (includes network + transport failures) ----
      - record: mcp_client:transport_errors:rate5m
        expr: sum by (gen_ai_tool_name, error_type) (rate(mcp_client_operation_duration_seconds_count{error_type!="", error_type!="tool_error"}[5m]))

  - name: genai.recording
    interval: 30s
    rules:
      - record: genai:tokens:rate5m
        expr: sum by (gen_ai_request_model, gen_ai_token_type) (rate(gen_ai_client_token_usage_sum[5m]))
      - record: genai:tokens_total:rate5m
        expr: sum(rate(gen_ai_client_token_usage_sum[5m]))
      - record: genai:tokens_total:rate1h
        expr: sum(rate(gen_ai_client_token_usage_sum[1h]))
      - record: genai:llm_calls:rate5m
        expr: sum by (gen_ai_request_model) (rate(gen_ai_client_operation_duration_seconds_count[5m]))
      - record: genai:llm_error_ratio:rate5m
        expr: |
          (
            sum by (gen_ai_request_model) (rate(gen_ai_client_operation_duration_seconds_count{error_type!=""}[5m]))
            or genai:llm_calls:rate5m * 0
          )
          / (genai:llm_calls:rate5m > 0)
      - record: genai:llm_latency_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le, gen_ai_request_model) (rate(gen_ai_client_operation_duration_seconds_bucket[5m])))

  - name: agent.recording
    interval: 30s
    rules:
      - record: agent:requests:rate5m
        expr: sum(rate(agent_request_duration_seconds_count[5m]))
      - record: agent:error_ratio:rate5m
        expr: |
          (sum(rate(agent_request_duration_seconds_count{error_type!=""}[5m])) or agent:requests:rate5m * 0)
          / (agent:requests:rate5m > 0)
      - record: agent:latency_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(agent_request_duration_seconds_bucket[5m])))
      - record: agent:tokens_per_request:p95_15m
        expr: histogram_quantile(0.95, sum by (le) (rate(agent_request_token_usage_bucket[15m])))
      - record: agent:tool_calls_per_request:p95_15m
        expr: histogram_quantile(0.95, sum by (le) (rate(agent_request_tool_calls_bucket[15m])))
