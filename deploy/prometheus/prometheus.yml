global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: local   # set per environment

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Application metrics (agent + MCP server) pushed via OTLP and exposed by the collector.
  - job_name: otel-collector-apps
    honor_labels: true          # keep job=<service.name> set by the collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Collector self-monitoring (dropped/failed telemetry).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
