# OpenTelemetry Collector: single ingest point for traces, metrics and logs.
#   traces  -> Tempo
#   metrics -> Prometheus (scraped from :8889)
#   logs    -> Loki (native OTLP endpoint)
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    send_batch_size: 1024
    timeout: 5s
  # Defence in depth: never ship credentials even if an app logs/attributes them.
  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: authorization
        action: delete

exporters:
  otlp/tempo:
    endpoint: ${env:TEMPO_OTLP_ENDPOINT:-tempo:4317}
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
    metric_expiration: 1m      # drop series of a stopped service quickly so "down" alerts fire fast
    enable_open_metrics: true   # exemplars -> click from a latency panel to the trace
  otlphttp/loki:
    endpoint: ${env:LOKI_OTLP_ENDPOINT:-http://loki:3100/otlp}
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [otlphttp/loki]
